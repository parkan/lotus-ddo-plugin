# Template ONLY -- do not commit real secrets.
#
# Create the wallet-keys secret after generating owner + worker wallets
# via `lotus wallet new bls` (or import existing JSON-encoded keys):
#
#   kubectl -n lotus-ddo create secret generic wallet-keys \
#     --from-file=owner.key=/path/to/owner.key \
#     --from-file=worker.key=/path/to/worker.key
#
# Files under wallet-keys/ must be in lotus's JSON wallet format, one key
# per file. Lotus will import them during bootstrap (see 04-lotus.yaml).
---
apiVersion: v1
kind: Secret
metadata:
  name: wallet-keys
  namespace: lotus-ddo
type: Opaque
stringData:
  # Intentionally empty -- replace with real keys via `kubectl create secret`.
  .placeholder: |
    this secret must be created out-of-band; see comment above
